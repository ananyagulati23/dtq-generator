<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTQ — All posts</title>
  <style>
    :root {
      --bg: #fafafa; --surface: #fff; --border: #e5e7eb;
      --text: #0a0a0a; --muted: #6b7280; --accent: #0e1b3d;
      --error: #b91c1c;
      --st-draft: #6b7280; --st-review: #b45309; --st-approved: #1e40af; --st-published: #047857;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh; padding: 28px 24px 80px;
    }
    .topnav {
      max-width: 980px; margin: 0 auto 16px; display: flex;
      justify-content: space-between; align-items: center;
    }
    .topnav a, .topnav span.right {
      color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500;
    }
    .topnav a:hover { color: var(--accent); }
    .wrap { max-width: 980px; margin: 0 auto; }
    .wordmark {
      font-family: Georgia, serif; font-size: 16px; font-weight: 700;
      letter-spacing: 4px; color: var(--accent); text-align: center; margin-bottom: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .filters {
      display: flex; gap: 16px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 20px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--muted);
    }
    select {
      padding: 8px 28px 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: inherit;
      background: #fff; min-width: 180px; appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%236b7280' d='M5 6L0 0h10z'/%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 10px center;
    }

    .group-header {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin: 28px 0 10px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%; border-collapse: collapse;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden;
    }
    th, td { padding: 12px 16px; text-align: left; font-size: 13px; }
    th {
      background: #fafafa; color: var(--muted); font-weight: 600;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
    }
    td { border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }
    .thumb {
      width: 48px; height: 48px; border-radius: 6px;
      object-fit: cover; background: #f3f4f6; display: block;
    }
    .title-cell { font-weight: 600; max-width: 360px; }
    .title-cell .sub { color: var(--muted); font-size: 11px; margin-top: 2px; font-weight: 400; }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    }
    .status-Draft { background: #f3f4f6; color: var(--st-draft); }
    .status-Ready-for-Review { background: #fef3c7; color: var(--st-review); }
    .status-Approved { background: #dbeafe; color: var(--st-approved); }
    .status-Published { background: #d1fae5; color: var(--st-published); }

    .empty {
      text-align: center; padding: 60px 24px; color: var(--muted);
      background: var(--surface); border: 1px dashed var(--border); border-radius: 10px;
    }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: var(--error);
      padding: 14px 16px; border-radius: 8px; font-size: 13px;
    }
    a.row-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; }
    a.row-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="topnav">
    <a href="/">← New post</a>
    <span class="right"><a href="/logout">Log out</a></span>
  </div>
  <div class="wrap">
    <div class="wordmark">DTQ</div>
    <h1>All posts</h1>
    <p class="sub">{{ records|length }} record{{ '' if records|length == 1 else 's' }} pulled from Airtable. Filter by assignee or status below.</p>

    {% if error %}
      <div class="error">Could not load posts: {{ error }}</div>
    {% elif not records %}
      <div class="empty">No posts yet. <a href="/">Generate the first one →</a></div>
    {% else %}
      <div class="filters">
        <div class="filter-group">
          <label for="filter-assignee">Assignee</label>
          <select id="filter-assignee" onchange="applyFilters()">
            <option value="">All</option>
            {% for m in team %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
            <option value="Unassigned">Unassigned</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-status">Status</label>
          <select id="filter-status" onchange="applyFilters()">
            <option value="">All</option>
            {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="filter-group">
          <label for="group-by">Group by</label>
          <select id="group-by" onchange="render()">
            <option value="none">Flat list</option>
            <option value="assignee" selected>Assignee</option>
            <option value="status">Status</option>
          </select>
        </div>
      </div>

      <div id="rendered"></div>
    {% endif %}
  </div>

  <script>
    const RECORDS = {{ records|tojson }};

    function statusClass(s) { return 'status-' + (s || 'Draft').replace(/ /g, '-'); }

    function filtered() {
      const a = document.getElementById('filter-assignee').value;
      const s = document.getElementById('filter-status').value;
      return RECORDS.filter(r =>
        (!a || r.assignee === a) && (!s || r.status === s)
      );
    }

    function rowHtml(r) {
      const safeTitle = (r.title || '(untitled)').replace(/</g, '&lt;');
      return `
        <tr>
          <td>${r.image_url ? `<img class="thumb" src="${r.image_url}" alt="" />` : '<div class="thumb"></div>'}</td>
          <td class="title-cell">${safeTitle}<div class="sub">${r.created || ''}</div></td>
          <td>${r.assignee || 'Unassigned'}</td>
          <td><span class="status-badge ${statusClass(r.status)}">${r.status}</span></td>
          <td>${r.image_url ? `<a class="row-link" href="${r.image_url}" target="_blank" rel="noopener">View image →</a>` : ''}</td>
        </tr>
      `;
    }

    function tableHtml(rows) {
      return `
        <table>
          <thead><tr>
            <th></th><th>Title</th><th>Assignee</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>${rows.map(rowHtml).join('')}</tbody>
        </table>
      `;
    }

    function render() {
      const rows = filtered();
      const target = document.getElementById('rendered');
      if (!target) return;
      if (rows.length === 0) {
        target.innerHTML = '<div class="empty">No posts match the current filters.</div>';
        return;
      }
      const groupBy = document.getElementById('group-by').value;
      if (groupBy === 'none') {
        target.innerHTML = tableHtml(rows);
        return;
      }
      const groups = {};
      rows.forEach(r => {
        const key = groupBy === 'assignee' ? (r.assignee || 'Unassigned') : (r.status || 'Draft');
        (groups[key] = groups[key] || []).push(r);
      });
      const order = Object.keys(groups).sort();
      target.innerHTML = order.map(g =>
        `<div class="group-header">${g} (${groups[g].length})</div>${tableHtml(groups[g])}`
      ).join('');
    }

    function applyFilters() { render(); }
    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
