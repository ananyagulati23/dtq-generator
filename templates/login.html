<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTQ — Sign in</title>
  <style>
    :root {
      --bg: #fafafa; --surface: #fff; --border: #e5e7eb;
      --text: #0a0a0a; --muted: #6b7280; --accent: #0e1b3d; --error: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .wordmark {
      font-family: Georgia, serif; font-size: 18px; font-weight: 700;
      letter-spacing: 4px; color: var(--accent); margin-bottom: 32px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 36px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
    p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    label {
      display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    input[type=password] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
    }
    input[type=password]:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 18px; padding: 13px; background: var(--accent);
      color: #fff; border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    button:hover { opacity: 0.9; }
    .error {
      margin-top: 14px; padding: 10px 12px; background: #fef2f2;
      border: 1px solid #fecaca; color: var(--error); border-radius: 8px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wordmark">DTQ</div>
  <form class="card" method="post" action="/login">
    <h1>Sign in</h1>
    <p>Enter the team password to access the generator.</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus />
    <button type="submit">Sign in</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
