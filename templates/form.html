<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DTQ Content Generator</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #0a0a0a;
      --muted: #6b7280;
      --accent: #0e1b3d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 80px;
    }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--accent);
      margin-bottom: 56px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 40px 36px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    p.lede {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    input[type=text], textarea {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]::placeholder, textarea::placeholder { color: #9ca3af; }
    input[type=text]:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 100px; resize: vertical; }
    .field { margin-bottom: 20px; }
    .note {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 0 24px;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wordmark">DTQ</div>
  <form class="card" method="post" action="/generate" onsubmit="document.getElementById('btn').innerText='Generating…';document.getElementById('btn').disabled=true;">
    <h1>LinkedIn Content Generator</h1>
    <p class="lede">Generate a LinkedIn post and an infographic card for Data Trust Quotients.</p>

    <div class="field">
      <label for="topic">Topic</label>
      <input type="text" id="topic" name="topic" placeholder="Leave blank to auto-pick a topic" />
    </div>

    <div class="field">
      <label for="custom_instructions">Custom instructions</label>
      <textarea id="custom_instructions" name="custom_instructions" placeholder="Optional: angle, audience focus, things to emphasize or avoid"></textarea>
    </div>

    <div class="note">Generation takes about 20–30 seconds. Don't refresh.</div>

    <button id="btn" type="submit">Generate post</button>
  </form>
</body>
</html>
